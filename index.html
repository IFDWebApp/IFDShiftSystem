<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IFD Shift System</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IFD Shift System">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: system-ui, "Noto Sans Thai", sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0f172a; padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  #off { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px; }
  #inst { position: fixed; inset: 0; z-index: 10; background: rgba(2,6,23,.82); display: flex; align-items: center; justify-content: center; padding: 20px; }
  #inst[hidden] { display: none; }
  #inst .card { width: 100%; max-width: 380px; background: #1e293b; border: 1px solid #334155; border-radius: 22px; padding: 26px 22px 20px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,.5); }
  #inst img { border-radius: 20px; }
  #inst h2 { margin: 12px 0 6px; font-size: 19px; }
  #inst p { margin: 0 0 14px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
  #inst ol { text-align: left; margin: 0 0 14px; padding-left: 22px; font-size: 14.5px; line-height: 1.8; }
  #inst button { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: #10b981; color: #052e24; font-size: 16px; font-weight: 700; font-family: inherit; }
  #inst button.ghost { margin-top: 6px; background: transparent; color: #94a3b8; font-size: 13.5px; font-weight: 500; }
  #inst .sh { display: inline-block; padding: 0 6px; border: 1px solid #475569; border-radius: 6px; }
  #off button { padding: 12px 22px; border: 0; border-radius: 12px; background: #10b981; color: #052e24; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<!-- ใส่ลิงก์ /exec ของ Apps Script ที่ Deploy แล้ว (ตรงนี้ที่เดียว) -->
<iframe id="app" title="Leave and Shift Change Request System"
  src="https://script.google.com/macros/s/AKfycbxkaa9l7UBr9aC1jufNn33VuUs1r0_EvHUCRWczsFhv3tEhXD6kxNcP1PlebT4-eFYzcw/exec"
  allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="inst" hidden>
  <div class="card">
    <img src="icons/icon-192.png" width="84" height="84" alt="">
    <h2>ติดตั้งแอป IFD Shift System</h2>
    <p id="instMsg"></p>
    <button id="instGo" hidden>ติดตั้งแอป</button>
    <ol id="instIos" hidden>
      <li>แตะปุ่ม <b>แชร์</b> <span class="sh">⬆︎</span> (แถบด้านล่างของ Safari)</li>
      <li>เลื่อนลงเลือก <b>เพิ่มไปยังหน้าจอโฮม</b></li>
      <li>แตะ <b>เพิ่ม</b> ที่มุมบนขวา</li>
    </ol>
    <ol id="instAnd" hidden>
      <li>แตะเมนู <b>⋮</b> มุมบนขวาของ Chrome</li>
      <li>เลือก <b>ติดตั้งแอป</b> หรือ <b>เพิ่มลงในหน้าจอหลัก</b></li>
    </ol>
    <button class="ghost" id="instSkip">ใช้งานต่อโดยไม่ติดตั้ง</button>
  </div>
</div>
<div id="off"><div style="font-size:18px">ไม่มีสัญญาณอินเทอร์เน็ต<br><small>ระบบต้องออนไลน์จึงจะใช้งานได้</small></div><button onclick="location.reload()">ลองใหม่</button></div>
<script>
  function sync() { document.getElementById('off').style.display = navigator.onLine ? 'none' : 'flex'; document.getElementById('app').style.visibility = navigator.onLine ? 'visible' : 'hidden'; }
  addEventListener('online', function () { sync(); document.getElementById('app').src = document.getElementById('app').src; });
  addEventListener('offline', sync); sync();
  // บอกหน้า Apps Script ว่าเปิดจากเปลือกแอป (เพื่อซ่อนปุ่ม "ติดตั้งแอป")
  (function () {
    var f = document.getElementById('app');
    function tell() { try { f.contentWindow.postMessage({ ifdApp: 1 }, '*'); } catch (e) {} }
    f.addEventListener('load', function () { tell(); setTimeout(tell, 800); setTimeout(tell, 2500); });
  })();
  // ติดตั้ง: เปิดด้วย ?install=1 (มาจากปุ่มในระบบ)
  (function () {
    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
    var q = new URLSearchParams(location.search);
    if (!q.has('install') || standalone) return;
    var box = document.getElementById('inst'), msg = document.getElementById('instMsg'), go = document.getElementById('instGo');
    var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var ev = null;
    box.hidden = false;
    document.getElementById('instSkip').onclick = function () { box.hidden = true; history.replaceState(null, '', location.pathname); };
    function manual() {
      go.hidden = true; msg.textContent = 'ทำตามขั้นตอนนี้เพื่อเพิ่มไอคอนไว้บนหน้าจอโฮม';
      document.getElementById(ios ? 'instIos' : 'instAnd').hidden = false;
    }
    if (ios) { manual(); return; }
    msg.textContent = 'เพิ่มไอคอนไว้บนหน้าจอโฮม เปิดใช้งานได้เร็วแบบเต็มจอ';
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); ev = e; go.hidden = false; document.getElementById('instAnd').hidden = true;
    });
    go.onclick = function () {
      if (!ev) return manual();
      ev.prompt(); ev.userChoice.then(function () { ev = null; box.hidden = true; });
    };
    window.addEventListener('appinstalled', function () { box.hidden = true; });
    setTimeout(function () { if (!ev) manual(); }, 1500);
  })();
  if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
</body>
</html>
